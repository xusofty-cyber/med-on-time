# MedOnTime 后台管理平台 nginx 配置：静态伺服 + SPA 回退 + /api 反代。
# 后端全局路由前缀即为 /api（services/api/src/main.ts setGlobalPrefix('api')，
# 健康探针全路径 /api/ops/health）。proxy_pass 不带 URI 部分时，nginx 将
# 客户端原始 URI 原样透传，正好保留 /api 前缀——切勿写成
# proxy_pass http://api:3000/;（带尾斜杠会剥掉 /api 前缀导致全线 404）。

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # API 反向代理 -> compose 服务 api:3000（原始路径透传，含 /api 前缀）
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite 构建产物带内容哈希，可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
