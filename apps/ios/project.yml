# MedOnTime iOS 工程定义（XcodeGen）。
# 生成 .xcodeproj：仓库根目录执行 `brew install xcodegen` 后，在本目录运行 `xcodegen generate`。
# 选用 project.yml 而非手写 project.pbxproj：源码树即工程结构，避免 pbxproj 手工维护的引用漂移。
name: MedOnTime
options:
  bundleIdPrefix: com.medontime
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.3.5"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MedOnTime:
    type: application
    platform: iOS
    sources:
      - path: MedOnTime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.medontime.app
        PRODUCT_NAME: MedOnTime
        INFOPLIST_FILE: MedOnTime/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: MedOnTime/MedOnTime.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
