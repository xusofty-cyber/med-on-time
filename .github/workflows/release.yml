# 药准时 MedOnTime —— 各端应用一键打包
#
# 用法（GitHub 仓库 Actions 页 → Release - 各端打包 → Run workflow）：
#   - targets 选择要打的端：all / desktop / android / ios / miniprogram
#   - publish 勾选后，各端产物会汇总到一个 GitHub Release（手动触发为草稿）
# 推 v* 标签（如 v0.1.0）时自动全端打包并正式发布 Release。
#
# 产物口径（均为未签名验证包，正式分发签名在发版机/商店流程完成）：
#   - 桌面（Electron）：Windows NSIS 安装包 / macOS DMG / Linux AppImage（原生 runner 各自构建，含 apps/web 产物）
#   - Android：assembleRelease 未签名 APK（applicationId com.medontime.app，Gradle 8.7 + JDK 17）
#   - iOS：XcodeGen 生成工程后 xcodebuild 无签名构建的 .app（zip）；上架签名/IPA 打包需证书 secrets，另行接入
#   - 小程序：Taro build:weapp 的 dist 目录（导入微信开发者工具上传；miniprogram-ci 自动上传可后续以 secrets 接入）
name: Release - 各端打包

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 要打包的端
        type: choice
        options: [all, desktop, android, ios, miniprogram]
        default: all
      publish:
        description: 产物汇总发布为 GitHub Release（草稿）
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  desktop:
    name: 桌面端 (${{ matrix.os }})
    if: ${{ github.ref_type == 'tag' || inputs.targets == 'all' || inputs.targets == 'desktop' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        - name: 构建共享包（Web 依赖其 dist）
        run: pnpm --filter @med-on-time/shared build
      - name: 构建 Web 产物（桌面端内嵌）
        run: pnpm --filter @med-on-time/web build
      - name: 构建桌面主进程
        run: pnpm --filter @med-on-time/desktop build
      - name: 打包 Windows (NSIS)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        run: ./node_modules/.bin/electron-builder --win nsis
      - name: 打包 macOS (DMG，未签名)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: ./node_modules/.bin/electron-builder --mac dmg
      - name: 打包 Linux (AppImage)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: ./node_modules/.bin/electron-builder --linux AppImage
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
          if-no-files-found: error

  android:
    name: 安卓端 (APK)
    if: ${{ github.ref_type == 'tag' || inputs.targets == 'all' || inputs.targets == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: 安装 Gradle 8.7（仓库只有 wrapper properties、未提交 gradlew）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 构建 Release APK（未签名）
        working-directory: apps/android
        run: gradle :app:assembleRelease --no-daemon
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  ios:
    name: iOS 端 (无签名 .app)
    if: ${{ github.ref_type == 'tag' || inputs.targets == 'all' || inputs.targets == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 XcodeGen 并生成工程
        working-directory: apps/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 无签名构建
        working-directory: apps/ios
        run: |
          xcodebuild build \
            -project MedOnTime.xcodeproj \
            -scheme MedOnTime \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: 打包 .app
        working-directory: apps/ios
        run: |
          cd build/DerivedData/Build/Products/Release-iphoneos
          zip -r "$GITHUB_WORKSPACE/MedOnTime-iOS-unsigned.zip" MedOnTime.app
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: MedOnTime-iOS-unsigned.zip
          if-no-files-found: error

  miniprogram:
    name: 小程序 (微信 dist)
    if: ${{ github.ref_type == 'tag' || inputs.targets == 'all' || inputs.targets == 'miniprogram' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建微信小程序
        run: pnpm --filter @med-on-time/miniprogram build:weapp
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: miniprogram-dist
          path: apps/miniprogram/dist
          if-no-files-found: error

  publish:
    name: 汇总发布 Release
    if: ${{ github.ref_type == 'tag' || inputs.publish }}
    needs: [desktop, android, ios, miniprogram]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总各端产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          name: "${{ github.ref_type == 'tag' && format('MedOnTime {0}', github.ref_name) || format('MedOnTime 手动打包 No.{0}', github.run_number) }}"
          draft: ${{ github.ref_type != 'tag' }}
          files: artifacts/**/*
          body: |
            药准时 MedOnTime 各端安装包（CI 自动打包，未签名验证包）。
            - 桌面：Windows 安装包（.exe）/ macOS（.dmg）/ Linux（.AppImage）
            - 安卓：未签名 APK（正式分发需签名）
            - iOS：无签名 .app 压缩包（仅验证构建；上架需证书签名）
            - 小程序：dist 目录在构建产物（Artifacts）中，需导入微信开发者工具上传
